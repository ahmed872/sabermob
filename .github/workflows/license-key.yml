name: توليد مفتاح تفعيل

# Vendor tool: issue a 3-month subscription key (500 EGP) for a customer's PC.
# The same request code is used for every renewal; each key adds 3 months on
# top of the days the customer has left. Run it twice for 6 months.
# Needs the repository secret LICENSE_PRIVATE_KEY (contents of private-key.pem).
# NOTE: in a PUBLIC repository, run logs and inputs are visible to everyone.
# Activation keys are bound to one PC so they are harmless to others, but do not
# put private customer details in the "customer" field — or make the repo private.

on:
  workflow_dispatch:
    inputs:
      request_code:
        description: 'كود الطلب من شاشة العميل (مثال: 7K3Q-9XWM-2PDA-HF6R)'
        required: true
        type: string
      customer:
        description: 'ملاحظة للسجل (اختياري — تظهر للعامة لو المستودع عام)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  issue:
    name: إصدار المفتاح
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: تجهيز المفتاح السري
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: |
          if [ -z "$LICENSE_PRIVATE_KEY" ]; then
            {
              echo '## ❌ المفتاح السري غير موجود'
              echo ''
              echo 'أضف محتوى ملف `private-key.pem` كـ Secret باسم **LICENSE_PRIVATE_KEY**:'
              echo '**Settings ← Secrets and variables ← Actions ← New repository secret**'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::LICENSE_PRIVATE_KEY secret is missing"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$LICENSE_PRIVATE_KEY" > "$RUNNER_TEMP/keys/private-key.pem"
          chmod 600 "$RUNNER_TEMP/keys/private-key.pem"

      - name: المفتاح العام (آمن للعرض)
        env:
          CENTRAL_LICENSE_KEY_DIR: ${{ runner.temp }}/keys
        run: |
          PUB="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/license/keygen.mts public-key)"
          echo "$PUB"
          if ! grep -q "$(echo "$PUB" | sed -n 2p)" src/main/license/public-key.ts; then
            {
              echo '## ⚠️ المفتاح السري مختلف عن المفتاح المبني في البرنامج'
              echo 'المفاتيح اللي هتطلع منه مش هتشتغل على النسخ القديمة. شغّل **بناء نسخة ويندوز** (بيربط مفتاحك أوتوماتيك) ووزّع النسخة الجديدة.'
              echo ''
              echo '```'
              echo "$PUB"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Secret does not match src/main/license/public-key.ts"
            exit 1
          fi

      - name: إصدار مفتاح الاشتراك (3 شهور — 500 جنيه)
        env:
          CENTRAL_LICENSE_KEY_DIR: ${{ runner.temp }}/keys
          REQUEST: ${{ inputs.request_code }}
          CUSTOMER: ${{ inputs.customer }}
        run: |
          REQUEST="$(echo "$REQUEST" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/license/keygen.mts issue \
            --request "$REQUEST" --plan quarterly --serial "${{ github.run_number }}" ${CUSTOMER:+--customer "$CUSTOMER"} \
            || { echo '## ❌ كود الطلب غير صحيح — راجعه مع العميل (16 حرف)' >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: مسح المفتاح السري
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
