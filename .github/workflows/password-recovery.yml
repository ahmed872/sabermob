name: استعادة كلمة مرور

# Vendor tool: a customer forgot the owner password. The login screen
# (نسيت كلمة المرور؟) shows a recovery code; this issues the one-time key.
# Needs the same LICENSE_PRIVATE_KEY secret as activation keys.
# Before sending the key, make sure the request really comes from the owner.

on:
  workflow_dispatch:
    inputs:
      recovery_code:
        description: 'كود الاستعادة من شاشة الدخول عند العميل (23 حرف)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: إصدار مفتاح الاستعادة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: تجهيز المفتاح السري
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: |
          if [ -z "$LICENSE_PRIVATE_KEY" ]; then
            echo '## ❌ المفتاح السري LICENSE_PRIVATE_KEY غير موجود' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$LICENSE_PRIVATE_KEY" > "$RUNNER_TEMP/keys/private-key.pem"
          chmod 600 "$RUNNER_TEMP/keys/private-key.pem"

      - name: إصدار مفتاح الاستعادة
        env:
          CENTRAL_LICENSE_KEY_DIR: ${{ runner.temp }}/keys
          CODE: ${{ inputs.recovery_code }}
        run: |
          CODE="$(echo "$CODE" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/license/keygen.mts recover --code "$CODE" \
            || { echo '## ❌ كود الاستعادة غير صحيح — راجعه مع العميل (23 حرف)' >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: مسح المفتاح السري
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
